<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmoSense - Identificador de emociones faciales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>EmoSense</h1>
  <p>Identificador de emociones faciales en tiempo real para personas con discapacidad visual</p>

  <div id="video-container">
    <video id="video" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>

  <div>
    <label for="sensitivity">Sensibilidad:</label>
    <select id="sensitivity">
      <option value="0.8">Alta</option>
      <option value="0.5" selected>Media</option>
      <option value="0.3">Baja</option>
    </select>
  </div>

  <div id="status-output" aria-live="polite">Cargando...</div>

  <div id="log-container">
    <h2>Registro de Emociones</h2>
    <ol id="emotion-log"></ol>
  </div>

  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
