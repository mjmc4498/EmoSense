<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmoSense - Identificador de emociones faciales</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>EmoSense</h1>
  <p>Identificador de emociones y señas en tiempo real.</p>

  <div id="instructions">
    <button id="close-instructions">&times;</button>
    <strong>Instrucciones:</strong> Muestre su cara y/o su mano a la cámara para iniciar la detección.
  </div>

  <div id="video-container">
    <video id="video" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>

  <div>
    <label for="sensitivity">Sensibilidad:</label>
    <select id="sensitivity">
      <option value="0.8">Alta</option>
      <option value="0.5" selected>Media</option>
      <option value="0.3">Baja</option>
    </select>
  </div>

  <div id="emotion-output" aria-live="polite">Cargando Emociones...</div>
  <div id="gesture-output" aria-live="polite">Cargando Gestos...</div>

  <div id="log-container">
    <h2>Registro de Eventos</h2>
    <ol id="event-log"></ol>
  </div>

  <!-- Face-api.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

  <!-- TensorFlow.js y dependencias -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.7.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.7.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.7.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

  <!-- Fingerpose -->
  <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.1.0/dist/fingerpose.min.js"></script>

  <script defer src="app.js"></script>
</body>
</html>
