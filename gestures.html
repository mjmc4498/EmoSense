<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EmoSense - Reconocimiento de Gestos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>EmoSense - Gestos</h1>
  <p>Reconocimiento de lengua de señas (ASL) en tiempo real</p>
  <p><a href="index.html">Volver al detector de emociones</a></p>

  <div id="video-container">
    <video id="video" width="320" height="240" autoplay muted playsinline></video>
    <canvas id="overlay" width="320" height="240"></canvas>
  </div>

  <div id="status-output" aria-live="polite">Cargando...</div>

  <!-- TensorFlow.js y dependencias -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@3.7.0/dist/tf-core.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@3.7.0/dist/tf-converter.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@3.7.0/dist/tf-backend-webgl.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js"></script>

  <!-- Fingerpose -->
  <script src="https://cdn.jsdelivr.net/npm/fingerpose@0.1.0/dist/fingerpose.min.js"></script>

  <script defer src="gestures.js"></script>
</body>
</html>
